# Keep the tmux muscle memory and skip the first-run wizard.
onboarding = false

[theme]
# WSL has no desktop appearance portal, so keep Herdr on a fixed theme.
name = "one-dark"
auto_switch = false

[terminal]
# New panes and tabs inherit the active pane/workspace directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
# Open the workspace picker with Ctrl+B, then move with Up/Down and select.
workspace_picker = "prefix+w"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
# Switch directly by position, or move to the adjacent workspace.
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+left"
next_workspace = "prefix+right"
# Keep workspace navigation on prefix+Left/Right. Use Shift+Left/Right to
# cycle the focused AI-agent instance shown in Herdr's agent panel.
previous_agent = "prefix+shift+left"
next_agent = "prefix+shift+right"

[ui]
agent_panel_sort = "spaces"

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Herdr server restart. Requires official integrations that report session refs.
resume_agents_on_restore = true

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = true
