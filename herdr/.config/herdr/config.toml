# Keep the tmux muscle memory and skip the first-run wizard.
onboarding = false

[terminal]
# New panes, tabs, and workspaces use Herdr's launch directory when there is
# no source pane/workspace to follow.
new_cwd = "current"

[keys]
prefix = "ctrl+b"

# Ctrl-h/j/k/l are provided by vim-herdr-navigation. The integration forwards
# them to Neovim, or focuses the neighbouring Herdr pane outside Neovim.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
agent_panel_sort = "spaces"

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Herdr server restart. Requires official integrations that report session refs.
resume_agents_on_restore = true

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = true

