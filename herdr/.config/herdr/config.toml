# Keep the tmux muscle memory and skip the first-run wizard.
onboarding = false

[theme]
# WSL has no desktop appearance portal, so keep Herdr on a fixed theme.
name = "catppuccin-latte"
auto_switch = false

[terminal]
# New panes and tabs inherit the active pane/workspace directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+b"

[ui]
agent_panel_sort = "spaces"

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Herdr server restart. Requires official integrations that report session refs.
resume_agents_on_restore = true

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = true
