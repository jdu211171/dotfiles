rules:
  # Preserve the existing trusted documentation and browser MCP servers.
  - capability: all
    effect: allow
  - capability: mcp
    match:
      - "chrome/*"
      - "context7/*"
      - "aws-docs/*"
    effect: allow

  # Read and inspect files within the active workspace.
  - capability: fs_read
    match:
      - "./**"
    effect: allow

  # Basic, non-mutating shell inspection commands.
  - capability: shell
    match:
      - "pwd"
      - "ls"
      - "ls *"
      - "tree"
      - "tree *"
      - "cat *"
      - "head *"
      - "tail *"
      - "grep *"
      - "rg *"
      - "wc *"
      - "stat *"
      - "file *"
      - "git status"
      - "git status *"
      - "git diff"
      - "git diff *"
      - "git log *"
      - "git show *"
      - "git ls-files *"
    effect: allow
