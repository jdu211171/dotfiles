# Atuin configuration
#
# Sync history to the self-hosted Atuin server. Agent commands remain recorded
# and attributed by Atuin, while interactive search defaults to human commands.

auto_sync = true
sync_address = "https://ngea.uz/atuin"
update_check = false
enter_accept = false
secrets_filter = true

# Keep the picker compact and unobtrusive, like the Oh My Posh zen prompt.
style = "compact"
inline_height = 12
show_preview = false
show_help = false
show_tabs = false
search_mode = "fuzzy"
filter_mode = "host"
filter_mode_shell_up_key_binding = "host"
keymap_mode = "auto"
workspaces = true

[search]
# Atuin's interactive search already hides agent-authored commands by default.
filters = ["host", "workspace", "directory", "session"]

[theme]
name = "minimal"
